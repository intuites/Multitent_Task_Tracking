<!doctype html><html lang="en-US"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="light dark"/><title>Taskify</title>
<script>/* apply the saved theme before first paint so dark mode never flashes white */try{var t=localStorage.getItem('tt-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
